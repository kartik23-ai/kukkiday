<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Candlelit Study — Kamya</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Plus+Jakarta+Sans:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/master.css">
    
    <style>
        body.realm-letters {
            background-color: #1a0b12;
            color: #fdfbf7;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        /* Warm candlelight atmosphere */
        .candle-scene {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .candle-scene::before {
            content: '';
            position: absolute;
            top: -5%;
            left: 50%;
            transform: translateX(-50%);
            width: 900px;
            height: 900px;
            background: radial-gradient(circle, rgba(232, 168, 124, 0.25) 0%, rgba(232, 168, 124, 0.08) 30%, transparent 65%);
            animation: candleFlicker 4s ease-in-out infinite alternate;
        }

        .candle-scene::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40%;
            background: linear-gradient(to top, rgba(26, 11, 18, 0.9), transparent);
        }

        @keyframes candleFlicker {
            0% { opacity: 0.8; transform: translateX(-50%) scale(1); }
            33% { opacity: 1; transform: translateX(-49%) scale(1.02); }
            66% { opacity: 0.85; transform: translateX(-51%) scale(0.98); }
            100% { opacity: 0.95; transform: translateX(-50%) scale(1.01); }
        }

        .content-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 100px 20px 80px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 2rem;
            opacity: 0;
            transform: translateY(20px);
        }

        .page-header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.5rem, 5vw, 4rem);
            color: #e8a87c;
            font-weight: 600;
            text-shadow: 0 0 30px rgba(232, 168, 124, 0.3);
            margin-bottom: 0.5rem;
        }

        .page-header p {
            font-family: 'Great Vibes', cursive;
            font-size: 1.8rem;
            color: rgba(255, 255, 255, 0.5);
        }

        /* Envelope */
        .desk-surface {
            position: relative;
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: center;
        }

        .envelope-container {
            position: relative;
            width: 600px;
            height: 360px;
            cursor: pointer;
            perspective: 1200px;
            max-width: 100%;
        }

        .envelope {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #3d1c2d, #2c1220);
            border-radius: 6px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
            border: 1px solid rgba(255, 255, 255, 0.04);
            z-index: 2;
        }

        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 0;
            border-left: 300px solid transparent;
            border-right: 300px solid transparent;
            border-top: 180px solid #4a2438;
            transform-origin: top;
            z-index: 4;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .envelope-front {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0;
            border-left: 300px solid #2a0f1c;
            border-right: 300px solid #2a0f1c;
            border-bottom: 180px solid #1f0a14;
            z-index: 3;
            pointer-events: none;
        }

        .wax-seal {
            position: absolute;
            top: 180px;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85px;
            height: 85px;
            background: radial-gradient(circle at 40% 35%, #e63946 0%, #cc2936 40%, #8b1c24 80%, #6d1420 100%);
            border-radius: 50%;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.6), inset 0 2px 6px rgba(255,255,255,0.25), 0 0 25px rgba(204,41,54,0.3);
            color: #ffd700;
            font-size: 1.6rem;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .wax-seal:hover {
            transform: translate(-50%, -50%) scale(1.08);
            box-shadow: 0 8px 20px rgba(0,0,0,0.6), inset 0 2px 6px rgba(255,255,255,0.3), 0 0 35px rgba(204,41,54,0.5);
        }

        .wax-text {
            position: absolute;
            top: 245px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.9rem;
            color: #e8a87c;
            z-index: 5;
            opacity: 0.7;
            letter-spacing: 2px;
            pointer-events: none;
            text-transform: uppercase;
            font-weight: 300;
        }

        /* Solid, opaque premium paper background */
        .letter-paper {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(40px);
            width: 92%;
            height: auto;
            min-height: 440px;
            background-color: #faf4ea;
            background-image: linear-gradient(180deg, #fdf8f0 0%, #f7efe2 100%);
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 0 1px rgba(139, 96, 64, 0.2);
            z-index: 1;
            opacity: 0;
            color: #2c1810;
        }

        .salutation {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem;
            color: #8b1c24;
            margin-bottom: 24px;
            font-weight: 600;
            font-style: italic;
        }

        .letter-body {
            font-family: 'Great Vibes', cursive;
            font-size: 1.9rem;
            line-height: 1.65;
            margin-bottom: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px 6px;
            color: #3a2219;
        }

        .word-group {
            opacity: 0;
            filter: blur(4px);
            transition: none;
        }

        .signature {
            font-family: 'Great Vibes', cursive;
            font-size: 2.4rem;
            color: #8b1c24;
            text-align: right;
            margin-top: 30px;
            opacity: 0;
        }

        .next-action {
            margin-top: 180px;
            opacity: 0;
            text-align: center;
        }

        /* Decorative elements */
        .desk-ornament {
            position: absolute;
            bottom: -60px;
            width: 100%;
            text-align: center;
            opacity: 0;
        }

        .desk-ornament i {
            color: rgba(232, 168, 124, 0.2);
            font-size: 1.2rem;
            margin: 0 8px;
        }

        @media (max-width: 768px) {
            .envelope-container {
                width: 92vw;
                height: 55vw;
            }
            .envelope-flap {
                border-left-width: 46vw;
                border-right-width: 46vw;
                border-top-width: 27.5vw;
            }
            .envelope-front {
                border-left-width: 46vw;
                border-right-width: 46vw;
                border-bottom-width: 27.5vw;
            }
            .wax-seal {
                top: 27.5vw;
                width: 70px;
                height: 70px;
            }
            .wax-text {
                top: calc(27.5vw + 55px);
            }
            .letter-paper {
                padding: 25px;
                width: 96%;
                min-height: 350px;
            }
            .letter-body {
                font-size: 1.5rem;
            }
            .next-action {
                margin-top: 240px;
            }
        }
    </style>
</head>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // ─── ENTRANCE ───
            gsap.to('.page-header', {
                opacity: 1, y: 0, duration: 1.5, ease: 'power3.out', delay: 0.5
            });

            // ─── LETTER TEXT SETUP ───
            const letterText = "From the moment you entered my life, every single day has felt brighter. Your laughter is my favorite sound in the whole world. Your kindness inspires me to become a better person every day. I am so grateful for every moment we share together. You are not just my girlfriend — you are my best friend, my comfort, and my home. Thank you for being exactly who you are. Happy Girlfriend Day, my love.";
            
            const words = letterText.split(' ');
            const letterContainer = document.getElementById('letter-content');
            
            for (let i = 0; i < words.length; i += 2) {
                const span = document.createElement('span');
                span.className = 'word-group';
                let groupText = words[i];
                if (words[i+1]) groupText += ' ' + words[i+1];
                if (i % 3 === 0 && words[i+2]) {
                    groupText += ' ' + words[i+2];
                    i++;
                }
                span.textContent = groupText + ' ';
                letterContainer.appendChild(span);
            }

            // ─── UNSEALING ANIMATION ───
            const envelope = document.getElementById('envelope-trigger');
            let isOpened = false;

            envelope.addEventListener('click', () => {
                if (isOpened) return;
                isOpened = true;

                const tl = gsap.timeline();

                // 1. Wax Seal shatters
                tl.to('#wax-text', { opacity: 0, duration: 0.3 })
                  .to('#wax-seal', { scale: 1.3, duration: 0.2, ease: 'power2.out' })
                  .to('#wax-seal', { scale: 0, opacity: 0, rotation: 45, duration: 0.4, ease: 'back.in(2)' })
                
                // 2. Flap opens
                  .to('#env-flap', { rotateX: 180, duration: 0.9, ease: 'power2.inOut', zIndex: 1 }, "-=0.15")
                
                // 3. Letter emerges cleanly to comfortable position
                  .to('.letter-paper', {
                      y: -140, 
                      opacity: 1, 
                      duration: 1.1, 
                      ease: 'power3.out',
                      zIndex: 10
                  }, "-=0.3")

                // 4. Envelope shifts down slightly
                  .to('.envelope-container', {
                      y: 80,
                      duration: 0.9,
                      ease: 'power2.inOut'
                  }, "-=0.6")
                
                // 5. Handwriting animation
                  .to('.word-group', {
                      opacity: 1,
                      filter: 'blur(0px)',
                      duration: 0.7,
                      stagger: 0.12,
                      ease: 'power1.out'
                  })
                  .to('.signature', {
                      opacity: 1,
                      duration: 1.2,
                      ease: 'power2.out'
                  })
                  .to('#desk-ornament', {
                      opacity: 1,
                      duration: 1
                  }, '-=0.5')
                  .to('.next-action', {
                      opacity: 1,
                      y: -20,
                      duration: 1,
                      ease: 'power2.out'
                  }, '-=0.5');
            });

            // ─── PARTICLE CANVAS: CANDLE FLAME + WARM DUST ───
            const canvas = document.getElementById('particle-canvas');
            const ctx = canvas.getContext('2d');
            let width, height;

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            let time = 0;
            const dustParticles = [];

            for (let i = 0; i < 20; i++) {
                dustParticles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 2 + 0.5,
                    vx: (Math.random() - 0.5) * 0.4,
                    vy: (Math.random() - 0.5) * 0.3 - 0.3,
                    alpha: Math.random() * 0.4 + 0.1,
                    twinkle: Math.random() * 0.03 + 0.01,
                    angle: Math.random() * Math.PI * 2
                });
            }

            function drawFlame(x, y, t) {
                ctx.save();
                ctx.translate(x, y);
                
                const wave = Math.sin(t * 5) * 2.5 + Math.sin(t * 13) * 1.2;
                const hWave = Math.sin(t * 3.5) * 5;

                // Wide outer glow
                const gOuter = ctx.createRadialGradient(0, 0, 0, 0, 0, 70 + hWave);
                gOuter.addColorStop(0, 'rgba(255, 150, 50, 0.3)');
                gOuter.addColorStop(0.5, 'rgba(255, 100, 20, 0.1)');
                gOuter.addColorStop(1, 'rgba(255, 100, 0, 0)');
                ctx.fillStyle = gOuter;
                ctx.beginPath();
                ctx.arc(0, 0, 90, 0, Math.PI * 2);
                ctx.fill();

                // Main flame body
                ctx.beginPath();
                ctx.moveTo(0, 18);
                ctx.bezierCurveTo(22, 18, 22, -8, 0 + wave, -45 - hWave);
                ctx.bezierCurveTo(-22, -8, -22, 18, 0, 18);
                
                const gMain = ctx.createLinearGradient(0, 18, 0, -45);
                gMain.addColorStop(0, 'rgba(255, 255, 240, 0.95)');
                gMain.addColorStop(0.2, 'rgba(255, 230, 130, 0.9)');
                gMain.addColorStop(0.5, 'rgba(255, 180, 60, 0.7)');
                gMain.addColorStop(1, 'rgba(255, 100, 0, 0)');
                ctx.fillStyle = gMain;
                ctx.fill();

                // Inner white core
                ctx.beginPath();
                ctx.moveTo(0, 10);
                ctx.bezierCurveTo(8, 10, 8, -3, wave * 0.3, -15 - hWave * 0.3);
                ctx.bezierCurveTo(-8, -3, -8, 10, 0, 10);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.fill();

                ctx.restore();
            }

            function render() {
                ctx.clearRect(0, 0, width, height);
                time += 0.016;

                // Draw Flame at top center
                drawFlame(width / 2, 70, time);

                // Draw warm dust
                for (const p of dustParticles) {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.angle += p.twinkle;
                    
                    if (p.y < -10) { p.y = height + 10; p.x = Math.random() * width; }
                    if (p.x < 0) p.x = width;
                    if (p.x > width) p.x = 0;

                    const twinkle = (Math.sin(p.angle) + 1) / 2;
                    const alpha = p.alpha * (0.4 + twinkle * 0.6);

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(232, 168, 124, ${alpha})`;
                    ctx.shadowBlur = 6;
                    ctx.shadowColor = `rgba(232, 168, 124, ${alpha * 0.5})`;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }

                requestAnimationFrame(render);
            }
            render();
        });
    </script>
