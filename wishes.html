<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamya - Wishes</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Great+Vibes&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Master CSS -->
    <link rel="stylesheet" href="css/master.css">
    
    <!-- Page Specific Styles -->
    <style>
        body.realm-wishes {
            background-color: #060410;
            color: #fff;
            overflow-x: hidden;
            position: relative;
        }
        
        .wishes-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            background: radial-gradient(circle at bottom left, rgba(247, 208, 112, 0.15) 0%, transparent 40%),
                        radial-gradient(circle at top right, rgba(100, 150, 255, 0.1) 0%, transparent 50%);
        }

        #starfield-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        .wishes-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8rem 2rem 6rem;
            position: relative;
            z-index: 1;
        }

        .hero-section {
            text-align: center;
            margin-bottom: 3rem;
        }

        .hero-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 5rem;
            color: #f7d070;
            margin-bottom: 1rem;
            text-shadow: 0 0 20px rgba(247, 208, 112, 0.6), 0 0 40px rgba(247, 208, 112, 0.3);
            font-weight: 600;
            opacity: 0;
            transform: translateY(30px);
            filter: blur(10px);
        }

        .hero-subtitle {
            font-family: 'Great Vibes', cursive;
            font-size: 2.2rem;
            color: #fff;
            opacity: 0;
            transform: translateY(20px);
        }

        .lantern-container {
            width: 950px;
            max-width: 90vw;
            height: 550px;
            background: rgba(15, 12, 30, 0.4);
            border: 1px solid rgba(247, 208, 112, 0.3);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5), inset 0 0 20px rgba(247, 208, 112, 0.05);
            margin-bottom: 4rem;
            overflow: visible; /* to let them fly out */
            opacity: 0;
            transform: translateY(40px);
        }

        .lantern {
            width: 44px;
            height: 60px;
            position: absolute;
            cursor: pointer;
            border-radius: 20px 20px 10px 10px;
            background: linear-gradient(to bottom, #ffea99, #f4a222, #c74d08);
            box-shadow: 0 0 25px rgba(244, 162, 34, 0.8), inset 0 -5px 10px rgba(0,0,0,0.3);
            transform-origin: center center;
            transition: box-shadow 0.3s;
        }

        .lantern::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 5px;
            background: #221505;
            border-radius: 2px;
        }

        .lantern:hover {
            box-shadow: 0 0 40px rgba(244, 162, 34, 1), inset 0 -5px 10px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .lantern-tooltip {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 5px 10px;
            border-radius: 5px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            border: 1px solid rgba(247, 208, 112, 0.4);
            box-shadow: 0 0 10px rgba(247, 208, 112, 0.2);
            z-index: 20;
        }

        .lantern:hover .lantern-tooltip {
            opacity: 1;
        }

        .action-wrapper {
            opacity: 0;
            transform: translateY(20px);
        }

        .btn-journey {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 1rem 2rem;
            background: transparent;
            border: 1px solid #f7d070;
            color: #f7d070;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-decoration: none;
            border-radius: 30px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-journey:hover {
            background: rgba(247, 208, 112, 0.1);
            box-shadow: 0 0 20px rgba(247, 208, 112, 0.3);
            transform: translateY(-2px);
        }
        
        .sparkle-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #f7d070;
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 8px #f7d070;
            z-index: 50;
        }
    </style>
</head>
<body class="realm-wishes">

    <div class="wishes-bg"></div>
    <canvas id="starfield-canvas"></canvas>

    <!-- Standard Nav Dock -->
    <nav class="nav-dock">
        <a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i> <span>Home</span></a>
        <a href="story.html" class="nav-link"><i class="fa-solid fa-book-bookmark"></i> <span>Story</span></a>
        <a href="gallery.html" class="nav-link"><i class="fa-solid fa-images"></i> <span>Gallery</span></a>
        <a href="letters.html" class="nav-link"><i class="fa-solid fa-envelope-open-text"></i> <span>Letters</span></a>
        <a href="garden.html" class="nav-link"><i class="fa-solid fa-seedling"></i> <span>Garden</span></a>
        <a href="music.html" class="nav-link"><i class="fa-solid fa-compact-disc"></i> <span>Music</span></a>
        <a href="album.html" class="nav-link"><i class="fa-solid fa-book-open"></i> <span>Album</span></a>
        <a href="wishes.html" class="nav-link active"><i class="fa-solid fa-wand-magic-sparkles"></i> <span>Wishes</span></a>
        <a href="surprise.html" class="nav-link"><i class="fa-solid fa-gift"></i> <span>Surprise</span></a>
    </nav>

    <!-- Standard Music Dock -->
    <div class="music-dock">
        <div class="vinyl-btn"><div class="vinyl-label"><i class="fa-solid fa-heart"></i></div></div>
        <div class="music-meta">
            <span class="music-meta-title">Lantern Festival</span>
            <span class="music-meta-status">Click to play</span>
        </div>
    </div>

    <main class="wishes-container">
        <div class="hero-section">
            <h1 class="hero-title">Wish Wall</h1>
            <p class="hero-subtitle">Click the lanterns to release wishes into Kamya's sky</p>
        </div>

        <div class="lantern-container" id="lantern-container">
            <!-- Lanterns generated by JS -->
        </div>

        <div class="action-wrapper">
            <a href="surprise.html" class="btn-journey"><i class="fa-solid fa-gift"></i> Unlock Final Surprise</a>
        </div>
    </main>

    <!-- Script Tags -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/audio-engine.js"></script>
    <script src="js/transitions.js"></script>

    <!-- Page Specific Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Starfield Canvas
            const canvas = document.getElementById('starfield-canvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            let stars = [];

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            class Star {
                constructor() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.size = Math.random() * 1.5 + 0.5;
                    this.baseAlpha = Math.random() * 0.5 + 0.1;
                    this.angle = Math.random() * Math.PI * 2;
                    this.speed = Math.random() * 0.05 + 0.01;
                }
                draw() {
                    this.angle += this.speed;
                    const alpha = this.baseAlpha + Math.sin(this.angle) * 0.3;
                    ctx.fillStyle = `rgba(255, 250, 230, ${Math.max(0.1, alpha)})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            for(let i = 0; i < 50; i++) {
                stars.push(new Star());
            }

            function animateStars() {
                ctx.clearRect(0, 0, width, height);
                stars.forEach(star => star.draw());
                requestAnimationFrame(animateStars);
            }
            animateStars();

            // Lanterns
            const container = document.getElementById('lantern-container');
            const wishes = [
                "Eternal happiness", "More adventures", "Endless laughter", 
                "A lifetime of love", "Peaceful mornings", "Starlit walks", 
                "Dream vacations", "Warm hugs forever", "Sunset picnics", 
                "Movie marathons", "Late night talks", "Coffee dates", 
                "Surprise gifts", "Dance in the rain", "Build our home", 
                "Travel the world", "Grow old together", "Infinite cuddles"
            ];
            
            // Adjust bounds based on container
            const lanternWidth = 44;
            const lanternHeight = 60;
            const padding = 30;

            function createLantern(wishText, isRespawn = false) {
                const lantern = document.createElement('div');
                lantern.className = 'lantern';
                
                const tooltip = document.createElement('div');
                tooltip.className = 'lantern-tooltip';
                tooltip.textContent = wishText;
                lantern.appendChild(tooltip);

                // Container bounds logic
                const containerRect = container.getBoundingClientRect();
                const cw = containerRect.width;
                const ch = containerRect.height;
                
                const minX = padding;
                const maxX = cw - lanternWidth - padding;
                const x = minX + Math.random() * (maxX - minX);
                
                let y;
                if(isRespawn) {
                    y = ch + 50; // spawn below container
                } else {
                    const minY = padding;
                    const maxY = ch - lanternHeight - padding;
                    y = minY + Math.random() * (maxY - minY);
                }

                lantern.style.left = `${x}px`;
                lantern.style.top = `${y}px`;
                container.appendChild(lantern);

                // Idle float animation
                const floatAnim = gsap.to(lantern, {
                    y: "-=20",
                    x: "+=" + (Math.random() * 20 - 10),
                    duration: 2 + Math.random() * 2,
                    yoyo: true,
                    repeat: -1,
                    ease: "sine.inOut"
                });

                // Hover interaction
                lantern.addEventListener('mouseenter', () => {
                    gsap.to(lantern, { scale: 1.15, duration: 0.3 });
                });
                lantern.addEventListener('mouseleave', () => {
                    gsap.to(lantern, { scale: 1, duration: 0.3 });
                });

                // Click to release
                let released = false;
                lantern.addEventListener('click', (e) => {
                    if(released) return;
                    released = true;
                    floatAnim.kill();

                    // Absolute position based on document to avoid container clipping issues
                    const rect = lantern.getBoundingClientRect();

                    // Release sequence
                    const tl = gsap.timeline({
                        onComplete: () => {
                            createSparkles(lantern.getBoundingClientRect());
                            lantern.remove();
                            // Respawn after 3s
                            setTimeout(() => {
                                createLantern(wishText, true);
                            }, 3000);
                        }
                    });

                    // 1. Scale up briefly
                    tl.to(lantern, {
                        scale: 1.3,
                        duration: 0.4,
                        ease: "back.out(1.7)"
                    })
                    // 2. Float up and fade
                    .to(lantern, {
                        y: "-=600",
                        opacity: 0,
                        duration: 2.5,
                        ease: "power2.in"
                    }, "+=0.1");
                });

                if(isRespawn) {
                    const targetY = padding + Math.random() * (ch - lanternHeight - padding * 2);
                    gsap.to(lantern, {
                        y: targetY - (ch + 50), // relative move
                        duration: 2,
                        ease: "power1.out",
                        onComplete: () => {
                            gsap.to(lantern, {
                                y: "-=20",
                                x: "+=" + (Math.random() * 20 - 10),
                                duration: 2 + Math.random() * 2,
                                yoyo: true,
                                repeat: -1,
                                ease: "sine.inOut"
                            });
                        }
                    });
                }
            }

            function createSparkles(rect) {
                const x = rect.left + rect.width/2;
                const y = rect.top;
                for(let i=0; i<10; i++) {
                    const spark = document.createElement('div');
                    spark.className = 'sparkle-particle';
                    document.body.appendChild(spark);
                    spark.style.left = `${x}px`;
                    spark.style.top = `${y}px`;

                    const angle = Math.random() * Math.PI * 2;
                    const radius = 30 + Math.random() * 50;
                    
                    gsap.to(spark, {
                        x: Math.cos(angle) * radius,
                        y: Math.sin(angle) * radius,
                        opacity: 0,
                        scale: 0.1,
                        duration: 0.8 + Math.random() * 0.5,
                        ease: "power2.out",
                        onComplete: () => spark.remove()
                    });
                }
            }

            // Create initial lanterns
            wishes.forEach(wish => {
                createLantern(wish);
            });

            // Entrance Timeline
            const entranceTl = gsap.timeline({ delay: 0.2 });
            entranceTl.to('.hero-title', {
                opacity: 1,
                filter: "blur(0px)",
                y: 0,
                duration: 1.5,
                ease: "power3.out"
            })
            .to('.hero-subtitle', { opacity: 1, y: 0, duration: 1 }, "-=1")
            .to('.lantern-container', { opacity: 1, y: 0, duration: 1.5, ease: "power2.out" }, "-=0.5")
            .to('.action-wrapper', { opacity: 1, y: 0, duration: 1 }, "-=0.5");
        });
    </script>
</body>
</html>
