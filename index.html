    <style>
        .hero-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2;
            text-align: center;
            pointer-events: none; /* Let clicks pass through except on children */
        }
        .hero-content {
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }
        .main-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(3.5rem, 5vw, 6rem);
            font-weight: 600;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 182, 193, 0.5);
            margin: 0;
            line-height: 1.1;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.3em;
        }
        .word {
            display: inline-flex;
            overflow: hidden;
            padding: 5px 0;
        }
        .letter {
            display: inline-block;
            opacity: 0;
            filter: blur(8px);
        }
        .subtitle {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(2rem, 3vw, 3rem);
            color: #d8b4e2; /* Lavender */
            margin: 0;
            opacity: 0;
            transform: translateY(20px);
            text-shadow: 0 0 15px rgba(216, 180, 226, 0.4);
        }
        .btn-wrapper {
            opacity: 0;
            transform: translateY(20px);
            margin-top: 2rem;
        }
        
        #webgl-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .atmosphere {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; pointer-events: none; mix-blend-mode: screen;
        }
    </style>
</head>
<body class="realm-home">

    <!-- Canvases -->

        <a href="music.html" class="nav-link"><i class="fa-solid fa-compact-disc"></i> <span>Music</span></a>

        <a href="wishes.html" class="nav-link"><i class="fa-solid fa-wand-magic-sparkles"></i> <span>Wishes</span></a>
        <a href="surprise.html" class="nav-link"><i class="fa-solid fa-gift"></i> <span>Surprise</span></a>
    </nav>

    <!-- Music Dock -->
    <div class="music-dock">
        <div class="vinyl-btn"><div class="vinyl-label"><i class="fa-solid fa-heart"></i></div></div>
        <div class="music-meta">
            <span class="music-meta-title">Cosmic Romance</span>
            <span class="music-meta-status">Click to play</span>
        </div>

    <!-- Main Content -->
    <main class="hero-container">
        <div class="hero-content">
            <h1 class="main-title" id="animated-title">
                <span class="word">
                    <span class="letter">H</span><span class="letter">a</span><span class="letter">p</span><span class="letter">p</span><span class="letter">y</span>
                </span>
                <span class="word">
                    <span class="letter">G</span><span class="letter">i</span><span class="letter">r</span><span class="letter">l</span><span class="letter">f</span><span class="letter">r</span><span class="letter">i</span><span class="letter">e</span><span class="letter">n</span><span class="letter">d</span>
                </span>
                <span class="word">
                    <span class="letter">D</span><span class="letter">a</span><span class="letter">y</span>
                </span>
            </h1>
            <h2 class="subtitle">For Kamya</h2>
            <div class="btn-wrapper">
                <a href="story.html" class="btn-journey interactive" data-parallax="0.02">

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
    
    <script src="js/engine.js"></script>
    <script src="js/audio-engine.js"></script>
    <script src="js/transitions.js"></script>

    <!-- Page Specific Scene & Animations -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // GSAP Entrance Sequence
            const tl = gsap.timeline({ delay: 1 }); // wait for transition overlay to fade
            
            // Letter animation
            const letters = document.querySelectorAll('.letter');
            tl.to(letters, {
                duration: 1.2,
                opacity: 1,
                filter: 'blur(0px)',
                stagger: 0.08,
                ease: 'power3.out'
            });

            // Subtitle animation
            tl.to('.subtitle', {
                duration: 1,
                opacity: 1,
                y: 0,
                ease: 'power3.out'
            }, '-=0.5');

            // Button animation
            tl.to('.btn-wrapper', {
                duration: 1,
                opacity: 1,
                y: 0,
                ease: 'power3.out'
            }, '-=0.6');

            // 3D Scene setup
            const webglCanvas = document.getElementById('webgl-canvas');
            const renderer = new THREE.WebGLRenderer({ canvas: webglCanvas, alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            const scene = new THREE.Scene();
            
            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 35;

            // Stars
            const starCount = 1500;
            const starGeo = new THREE.BufferGeometry();
            const starPositions = new Float32Array(starCount * 3);
            const starOpacities = new Float32Array(starCount);

            for (let i = 0; i < starCount; i++) {
                // Sphere distribution
                const r = 200 * Math.cbrt(Math.random());
                const theta = Math.random() * 2 * Math.PI;
                const phi = Math.acos(2 * Math.random() - 1);
                
                starPositions[i*3] = r * Math.sin(phi) * Math.cos(theta);
                starPositions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
                starPositions[i*3+2] = r * Math.cos(phi);
                
                starOpacities[i] = Math.random();
            }
            
            starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
            starGeo.setAttribute('opacity', new THREE.BufferAttribute(starOpacities, 1));
            
            const starMat = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 1.5,
                transparent: true,
                opacity: 0, // initially 0 for fade in
                sizeAttenuation: true
            });
            
            const stars = new THREE.Points(starGeo, starMat);
            scene.add(stars);

            // Fade in stars
            gsap.to(starMat, { opacity: 0.8, duration: 2, delay: 1 });

            // 3D Heart
            const x = 0, y = 0;
            const heartShape = new THREE.Shape();
            heartShape.moveTo( x + 5, y + 5 );
            heartShape.bezierCurveTo( x + 5, y + 5, x + 4, y, x, y );
            heartShape.bezierCurveTo( x - 6, y, x - 6, y + 7,x - 6, y + 7 );
            heartShape.bezierCurveTo( x - 6, y + 11, x - 3, y + 15.4, x + 5, y + 19 );
            heartShape.bezierCurveTo( x + 12, y + 15.4, x + 16, y + 11, x + 16, y + 7 );
            heartShape.bezierCurveTo( x + 16, y + 7, x + 16, y, x + 10, y );
            heartShape.bezierCurveTo( x + 7, y, x + 5, y + 5, x + 5, y + 5 );

            const extrudeSettings = {
                depth: 2,
                bevelEnabled: true,
                bevelSegments: 2,
                steps: 2,
                bevelSize: 1,
                bevelThickness: 1
            };
            
            const heartGeo = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
            // Center the heart geometry
            heartGeo.computeBoundingBox();
            const box = heartGeo.boundingBox;
            const offset = new THREE.Vector3().subVectors(box.max, box.min).multiplyScalar(0.5).add(box.min);
            heartGeo.translate(-offset.x, -offset.y, -offset.z);
            // Rotate 180deg because the shape draws upside down by default
            heartGeo.rotateZ(Math.PI);

            const heartMat = new THREE.MeshPhongMaterial({
                color: 0xff4d8d,
                emissive: 0x6d1040,
                shininess: 80,
                transparent: true,
                opacity: 0
            });
            
            const heartMesh = new THREE.Mesh(heartGeo, heartMat);
            heartMesh.position.set(0, 0, -10);
            scene.add(heartMesh);

            // Fade in heart
            gsap.to(heartMat, { opacity: 1, duration: 2, delay: 1.5 });

            // Lights
            const pLight = new THREE.PointLight(0xfff0e6, 1.5, 100);
            pLight.position.set(15, 15, 15);
            scene.add(pLight);
            
            const aLight = new THREE.AmbientLight(0x1a1a3e, 0.4);
            scene.add(aLight);

            // Mouse interaction
            let mouseX = 0;
            let mouseY = 0;
            window.addEventListener('mousemove', (e) => {
                mouseX = (e.clientX / window.innerWidth) * 2 - 1;
                mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
            });
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                particleCanvas.width = window.innerWidth;
                particleCanvas.height = window.innerHeight;
            });

            // 2D Particles setup
            const particleCanvas = document.getElementById('particle-canvas');
            const ctx = particleCanvas.getContext('2d');
            particleCanvas.width = window.innerWidth;
            particleCanvas.height = window.innerHeight;

            const particles2D = [];
            for (let i = 0; i < 40; i++) {
                particles2D.push({
                    x: Math.random() * particleCanvas.width,
                    y: Math.random() * particleCanvas.height,
                    vx: (Math.random() - 0.5) * 0.2,
                    vy: -0.2 - Math.random() * 0.3,
                    size: 1 + Math.random() * 2,
                    color: ['rgba(255,255,255', 'rgba(255,182,193', 'rgba(255,215,0'][Math.floor(Math.random()*3)]
                });
            }

            const clock = new THREE.Clock();

            // Render loop
            function animate() {
                requestAnimationFrame(animate);
                const t = clock.getElapsedTime();

                // 3D Updates
                heartMesh.rotation.y += 0.008;
                heartMesh.rotation.x = Math.sin(t * 0.5) * 0.1;
                const scale = 1 + Math.sin(t * 2) * 0.05;
                heartMesh.scale.set(scale, scale, scale);

                camera.position.x = Math.sin(t * 0.5);
                camera.position.y = Math.cos(t * 0.3) * 0.5;
                camera.lookAt(scene.position);

                // Mouse parallax
                stars.rotation.y = -mouseX * 0.05;
                stars.rotation.x = mouseY * 0.05;

                // Twinkle stars
                const opacities = stars.geometry.attributes.opacity.array;
                for(let i=0; i<starCount; i++) {
                    opacities[i] = 0.5 + 0.5 * Math.sin(t * 2 + i);
                }
                stars.geometry.attributes.opacity.needsUpdate = true;

                renderer.render(scene, camera);

                // 2D Particles update
                ctx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
                
                const mx = (mouseX + 1) / 2 * particleCanvas.width;
                const my = (1 - mouseY) / 2 * particleCanvas.height;

                for (let p of particles2D) {
                    p.x += p.vx;
                    p.y += p.vy;
                    
                    // Repel from cursor
                    const dx = p.x - mx;
                    const dy = p.y - my;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 80) {
                        p.x += dx * 0.05;
                        p.y += dy * 0.05;
                    }

                    if (p.y < 0) {
                        p.y = particleCanvas.height;
                        p.x = Math.random() * particleCanvas.width;
                    }
                    if (p.x < 0) p.x = particleCanvas.width;
                    if (p.x > particleCanvas.width) p.x = 0;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = `${p.color}, ${0.4 + 0.6 * Math.sin(t * 3 + p.x)})`;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = ctx.fillStyle;
                    ctx.fill();
                }
            }
            animate();
        });
    </script>
</body>
</html>
